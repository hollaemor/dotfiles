"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format="""
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$kubernetes\
$gcloud\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$python\
$docker_context\
$container\
$status\
$sudo\
$aws\
$memory_usage\
$azure\
$buf\
$zig\
$terraform\
$lua\
$gradle\
$dotnet\
$helm\
$cmd_duration\
$character
"""

[directory]
format = "[ $path ]($style)"
home_symbol = "󰟐 "

[directory.substitutions]
"Documents" = " 󰈙 "
"Downloads" = "  "
"Music" = " 󰝚 "
"Pictures" = "  "
"Developer" = " 󰲋 "
# "code/gitlab.com" = " 󰮠 "
"code/gitlab.com/cargoone" = " 🛩️ "
"code/github.com" = "  "
# "code/gitlab.com/cargoone" = "   "

[git_branch]
# symbol = ""
# format = '[[ $symbol $branch ](fg:color_fg0)]($style)'
format = '[$symbol$branch(:$remote_branch)]($style) '

# [git_status]
# format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[nodejs]
symbol = ""
# format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'
# format = '[[ $symbol( $version) ]]'

[c]
symbol = " "

[rust]
symbol = ""

[golang]
symbol = " "
# format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
# format = '[$symbol( $version $virtualenv)'

[docker_context]
symbol = ""


[time]
disabled = true
time_format = "%R"
# format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[kubernetes]
disabled = false
format='[$symbol]($style)'
contexts = [
  { context_pattern = "gke_cargo-one_europe-west3-b_staging", symbol = "☸  "},
  { context_pattern = "gke_cargo-one_europe-west3-b_production", symbol = "💣💥 "}
]


[line_break]
disabled = false

[gcloud]
disabled = true
symbol = '️🇬️ '
format = '[$symbol]($style)'

# [character]
# disabled = false
# success_symbol = '[](bold fg:color_green)'
# error_symbol = '[](bold fg:color_red)'
# vimcmd_symbol = '[](bold fg:color_green)'
# vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
# vimcmd_replace_symbol = '[](bold fg:color_purple)'
# vimcmd_visual_symbol = '[](bold fg:color_yellow)'

