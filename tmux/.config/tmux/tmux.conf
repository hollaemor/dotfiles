# improve colors
set -g default-terminal 'tmux-256color'
set -sa terminal-overrides ",*:RGB"

# remap prefix from C-b to C-a
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# split panes using | and -
# bind | split-window -h
# bind - split-window -v
# unbind '"'
# unbind %


# enable mouse mode
set -g mouse on

# don't rename windows automatically
set-option -wg allow-rename off

# create new panes in the same working directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# navigation
# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Use vim arrow keys to resize
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# reload
bind-key C-r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded"

# set escape time to 10 ms
set -sg escape-time 10

# Vi copypaste mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# natural numbering
set-option -g base-index 1
# set-option -g renumber-windows on
# Start windows and panes at 1, not 0
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

set-window-option -g activity-action any
set-window-option -g monitor-activity off

set -g focus-events on

set -g cursor-style blinking-underline


# styling
#
# Style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position top
set -g status-style "bg=default"
set -g status-left-length 100
set -g status-right-length 80
set -g status-style "fg=${gray_light},bg=default"
set -g status-left ""
set -g window-status-style "fg=${gray_medium},dim"
set -g window-status-format " #I:#W"
set -g window-status-current-format "#[fg=${gray_light},bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${green_soft}"

# agent indicator (tmux-agent-indicator)
set -g @agent-indicator-indicator-enabled 'on'
set -g @agent-indicator-processes 'cursor,claude,codex,aider,opencode'
set -g @agent-indicator-icons 'cursor=,claude=🤖,codex=🧠,default=🤖'
set -g @agent-indicator-reset-on-focus 'on'

set -g status-right "#{agent_indicator} #[fg=${green_soft},bold] #S #[fg=${gray_light}]%H:%M %d-%b"

run-shell '~/.tmux/plugins/tmux-agent-indicator/agent-indicator.tmux'

