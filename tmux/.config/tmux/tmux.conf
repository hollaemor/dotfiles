# improve colors
set -g default-terminal 'tmux-256color'

# remap prefix from C-b to C-a
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# split panes using | and -
# bind | split-window -h
# bind - split-window -v
# unbind '"'
# unbind %


# enable mouse mode
set -g mouse on

# don't rename windows automatically
set-option -wg allow-rename off

# create new panes in the same working directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# navigation
# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# reload
bind-key C-r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded"

# set escape time to 10 ms
set -sg escape-time 10

# Vi copypaste mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

# natural numbering
set-option -g base-index 1
# set-window-option -g pane-base-index 1
# set-option -g renumber-windows on

set-window-option -g activity-action any
set-window-option -g monitor-activity on

set -g cursor-style blinking-underline


# styling
set -g status-style "bg=default"
set -g status-position top


set -g status-left ""
set -g status-right "#[bold] #S"

